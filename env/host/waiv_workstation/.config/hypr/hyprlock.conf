# hyprlock — lock screen (SUPER+CTRL+L, and via hypridle).
# Replaces `betterlockscreen --lock blur` from the old i3 config.
# Reference: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
    disable_loading_bar = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.011
    contrast = 0.9
    brightness = 0.75
    vibrancy = 0.17
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(202, 211, 245, 1.0)
    font_size = 96
    font_family = CaskaydiaCove Nerd Font Bold
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(165, 173, 203, 1.0)
    font_size = 20
    font_family = CaskaydiaCove Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.32
    dots_center = true

    outer_color = rgba(198, 160, 246, 0.9)
    inner_color = rgba(36, 39, 58, 0.85)
    font_color = rgba(202, 211, 245, 1.0)
    check_color = rgba(138, 173, 244, 1.0)
    fail_color = rgba(237, 135, 150, 1.0)

    fade_on_empty = false
    placeholder_text = <span foreground="##a5adcb">Enter password</span>
    fail_text = <span foreground="##ed8796">$FAIL ($ATTEMPTS)</span>
    rounding = 12

    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text =   $USER
    color = rgba(202, 211, 245, 1.0)
    font_size = 16
    font_family = CaskaydiaCove Nerd Font
    position = 0, 20
    halign = center
    valign = center
}
