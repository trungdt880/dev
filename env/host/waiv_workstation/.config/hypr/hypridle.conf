# hypridle — idle management daemon.
# Reference: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid stacking lock screens
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # wake the display on resume
}

# Dim the backlight as a warning shot.
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# Lock.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Screen off.
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# This is a desktop, not a laptop — no automatic suspend listener on purpose.
