# Hyprland — waiv_workstation (Ubuntu 26.04, Wayland)
#
# Keybinds deliberately mirror env/desktop/mac/.config/aerospace/aerospace.toml
# so muscle memory carries between the mac and this box:
#   SUPER (= cmd on mac) -> focus / workspaces / launching
#   ALT                  -> window ops (close, float, fullscreen, resize, gaps)
#
# Reference: https://wiki.hypr.land/Configuring/

################################################################################
# MONITORS
################################################################################
# name, resolution, position, scale.  `preferred,auto,1` = autodetect everything.
# `hyprctl monitors` prints the live names to pin specific layouts here.
monitor = , preferred, auto, 1

################################################################################
# ENVIRONMENT
################################################################################
# --- GPU selection -----------------------------------------------------------
# This box has an Intel iGPU (pci 0000:00:02.0) and an RTX 5090 (pci 0000:02:00.0).
# The display is wired to the NVIDIA card, so aquamarine must open that DRM node.
#
# This MUST be the real device node. Aquamarine matches the value against the
# nodes it enumerated from udev, so a /dev/dri/by-path/... symlink does not
# match, and it fails hard rather than falling back:
#     drm: Explicit device /dev/dri/by-path/... not found
#     drm: Found no gpus to use, cannot continue
#   -> CBackend::create() failed!  (login bounces straight back to the greeter)
#
# Re-derive after any GPU/driver change with:
#     readlink -f /dev/dri/by-path/pci-0000:02:00.0-card
env = AQ_DRM_DEVICES,/dev/dri/card2

# --- NVIDIA ------------------------------------------------------------------
# Requires nvidia_drm.modeset=1 (already on — GNOME Wayland would not run without it).
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
# If you ever see a flickering / invisible cursor, uncomment:
# cursor:no_hardware_cursors = true

# --- Toolkits ----------------------------------------------------------------
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = MOZ_ENABLE_WAYLAND,1
# Electron/Chromium apps pick Wayland instead of blurry XWayland.
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# --- Cursor ------------------------------------------------------------------
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# --- ibus (matches env/desktop/linux/.zshrc.local) ---------------------------
env = GTK_IM_MODULE,ibus
env = QT_IM_MODULE,ibus
env = XMODIFIERS,@im=ibus

################################################################################
# AUTOSTART
################################################################################
# Hyprland's own polkit agent, not a generic desktop one. Launched by binary,
# not `systemctl --user start`: the Ubuntu packages ship systemd user units for
# waybar/mako/hypridle/hyprpaper/hyprpolkitagent that are globally enabled and
# WantedBy=graphical-session.target with no compositor condition, so they fire
# inside GNOME too and fail there. runs/hyprland masks them in user scope and
# startup is driven from here instead.

exec-once = /usr/libexec/hyprpolkitagent
exec-once = waybar
exec-once = mako
# Wallpaper. swaybg, not hyprpaper: the hyprpaper 0.8.3 build in Ubuntu 26.04
# never reads its config at all -- it does not even error on `-c /nonexistent`,
# it just connects to Wayland and draws nothing, leaving an empty background
# layer. swaybg is packaged, tiny, and speaks plain layer-shell.
exec-once = swaybg -i $HOME/.config/hypr/wallpaper.png -m fill
exec-once = hypridle
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = ibus-daemon -drxR
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Only needed on the plain "Hyprland" session, which is NOT the one to use --
# log in with "Hyprland (uwsm-managed)".
#
# The plain session never activates graphical-session.target (that target sets
# RefuseManualStart, so a compositor cannot just start it; it has to be pulled
# in by a session unit). Without it xdg-desktop-portal-hyprland never starts,
# so the Settings portal has no backend, and the first GTK app of the session
# -- ghostty, nautilus -- blocks on D-Bus trying to autostart the GTK portal
# until systemd's 120s activation timeout expires. That is the "terminal takes
# minutes to appear" symptom.
#
# uwsm's wayland-session@.target declares BindsTo=graphical-session.target,
# which fixes it properly. This line stays as a harmless no-op under uwsm and
# as a partial fallback if the plain session is ever used.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE

# Hyprland disables logging right after the config loads, which leaves an empty
# hyprland.log and a crash report truncated well before the actual failure.
# Keep it on — this is what made the backend crash above diagnosable at all.
debug {
    disable_logs = false
}

################################################################################
# INPUT
################################################################################
input {
    kb_layout = us
    # CapsLock is remapped by keyd (see runs/keyd): tap = Escape, hold = Ctrl.
    # Deliberately NOT `caps:escape` here. XKB can only do one or the other,
    # never tap-vs-hold, and keyd works at the evdev layer below the
    # compositor, so the capslock keycode never reaches XKB anyway.
    kb_options =

    # Both references agree: the pointer must not steal focus.
    # i3 config:  focus_follows_mouse no
    # aerospace:  on-focus-changed = 'move-mouse window-lazy-center'
    # i.e. the mouse follows the focus, never the other way round. The warp
    # half is configured in the cursor{} block below.
    follow_mouse = 0
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

# 0.53 replaced the old `gestures { workspace_swipe = ... }` block with this
# keyword form: <fingers>, <direction>, <action>.
gesture = 3, horizontal, workspace

# Mouse warps to the focused window, like aerospace's move-mouse.
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true

    # MUST stay true on this box.
    #
    # Hyprland watches hyprland.conf and reloads on change. dev-env installs
    # .config/<tool> by wipe-and-replace (safe_rm then cp -r), so during every
    # `./dev-env` run this file briefly does not exist. The watcher fires on the
    # delete, reloads an absent config, and ends up with ZERO keybinds; because
    # the watch was on the deleted inode it never re-fires when the file
    # reappears. The symptom is the whole SUPER layer going dead right after
    # running dev-env -- SUPER+2 just types "2".
    #
    # With autoreload off, the previously loaded config stays live across a
    # dev-env run and changes are picked up by an explicit `hyprctl reload`
    # (SUPER+SHIFT+C), which is this repo's documented workflow anyway.
    disable_autoreload = true
}

cursor {
    # The 'move-mouse' half of aerospace's focus callbacks: warp the pointer
    # onto whatever just took focus, including across workspace switches.
    no_warps = false
    warp_on_change_workspace = true
}

################################################################################
# LOOK & FEEL
################################################################################
# Gap values mirror the aerospace [gaps] block (inner 10 / outer 10). The top
# gap there was 52 to clear sketchybar; waybar reserves its own exclusive zone,
# so no manual top offset is needed here.
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    # Catppuccin Macchiato mauve -> blue gradient, matching the repo's palette.
    col.active_border = rgba(c6a0f6ee) rgba(8aadf4ee) 45deg
    col.inactive_border = rgba(494d64aa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = true

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1

    animation = windows,     1, 4, easeOutQuint, popin 87%
    animation = windowsOut,  1, 3, easeOutQuint, popin 87%
    animation = border,      1, 6, linear
    animation = fade,        1, 3, easeOutQuint
    animation = workspaces,  1, 4, easeOutQuint, slide
    animation = layers,      1, 3, easeOutQuint, fade
}

dwindle {
    # Keep the split ratio when a sibling closes, like aerospace's
    # enable-normalization-flatten-containers = false.
    pseudotile = true
    preserve_split = true
    smart_split = false

    # Where a new window lands relative to the focused one.
    #   0 = depends on where the mouse is inside the focused window (default,
    #       which is why new windows seemed to land on the left at random)
    #   1 = always left / top
    #   2 = always right / bottom
    force_split = 2
}

master {
    new_status = master
}

################################################################################
# WINDOW RULES
################################################################################
# 0.53 syntax: window rules are BLOCKS with `match:<field>` selectors, not the
# older `windowrule = <rule>, <matcher>` one-liners. `Hyprland --verify-config`
# is the way to check these; see /usr/share/hypr/hyprland.conf for the shipped
# examples.

# Mirrors the i3 config's `for_window [window_role="pop-up"] floating enable`.
windowrule {
    name = float-utility-apps
    match:class = ^(pavucontrol|blueman-manager|nm-connection-editor|nwg-look|org.gnome.Calculator|Arandr)$
    float = yes
}

windowrule {
    name = float-file-dialogs
    match:class = ^(xdg-desktop-portal-gtk)$
    float = yes
}

windowrule {
    name = float-file-dialog-titles
    match:title = ^(Open File|Save File|Save As|Choose Files)$
    float = yes
}

windowrule {
    name = pavucontrol-size
    match:class = ^(pavucontrol)$
    size = 60% 60%
    center = yes
}

# No lock / no screen blank while something is playing fullscreen.
windowrule {
    name = idle-inhibit-fullscreen
    match:class = .*
    idle_inhibit = fullscreen
}

# Suppress the "maximize" event spam some Electron apps emit.
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

# Fix drag-and-drop / tooltip misplacement for XWayland clients.
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

################################################################################
# KEYBINDS
################################################################################
# Everything is on SUPER. The mac config splits between cmd and alt only because
# macOS reserves some cmd combinations; that constraint does not exist here, so
# the alt half of aerospace.toml is folded onto SUPER. The aerospace equivalent
# is noted next to each bind that has one.
$mainMod = SUPER
$terminal = ghostty
$menu = rofi -show drun
$fileManager = yazi

# --- Launching ---------------------------------------------------------------
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod SHIFT, D, exec, rofi -show run
bind = $mainMod, E, exec, $terminal -e $fileManager
# Window switcher across all workspaces.
bind = $mainMod, Tab, exec, rofi -show window

# --- Focus (aerospace cmd-h/j/k/l) -------------------------------------------
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# --- Move window (aerospace cmd-shift-h/j/k/l) -------------------------------
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

# --- Window ops (these were ALT on the mac) ----------------------------------
# aerospace alt-w
bind = $mainMod, W, killactive,
# aerospace alt-f
bind = $mainMod, F, fullscreen, 0
# aerospace alt-t
bind = $mainMod, T, togglefloating,
# aerospace alt-a (workspace-back-and-forth)
bind = $mainMod, A, workspace, previous
bind = $mainMod, P, pseudo,
# aerospace alt-g
bind = $mainMod, G, exec, $HOME/.config/hypr/scripts/toggle-gaps.sh
# aerospace alt-m
bind = $mainMod, M, submap, move-all

# aerospace alt-minus / alt-equal = resize smart -/+50
binde = $mainMod, minus, resizeactive, -50 0
binde = $mainMod, equal, resizeactive, 50 0
binde = $mainMod SHIFT, minus, resizeactive, 0 -50
binde = $mainMod SHIFT, equal, resizeactive, 0 50

# --- Layout ------------------------------------------------------------------
# aerospace cmd-slash and alt-s both amount to flipping the dwindle split axis.
bind = $mainMod, slash, togglesplit,
# aerospace cmd-comma 'layout accordion' -> a tabbed group is the closest thing.
bind = $mainMod, comma, togglegroup,
bind = $mainMod, bracketleft, changegroupactive, b
bind = $mainMod, bracketright, changegroupactive, f

# --- Workspaces (aerospace cmd-1..0 / cmd-shift-1..0) ------------------------
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scratchpad. On grave rather than S, so SUPER+SHIFT+S stays free for the
# region screenshot.
bind = $mainMod, grave, togglespecialworkspace, magic
bind = $mainMod SHIFT, grave, movetoworkspace, special:magic

# --- Session -----------------------------------------------------------------
# Lock. SUPER+L is focus-right above, so this keeps the $mod+Ctrl+l that the
# old i3 config used for betterlockscreen. `pidof` guard stops a second
# hyprlock stacking on top of the first.
bind = $mainMod CTRL, L, exec, pidof hyprlock || hyprlock
# Log out: ends the session and returns to the login screen.
bind = $mainMod CTRL SHIFT, L, exit,
bind = $mainMod SHIFT, Delete, exec, systemctl poweroff
bind = $mainMod SHIFT, C, exec, hyprctl reload
bind = $mainMod SHIFT, R, exec, $HOME/.config/hypr/scripts/restart-waybar.sh

################################################################################
# SUBMAP: move-all — move EVERY window of this workspace to workspace N
# Mirrors aerospace's [mode.move-all.binding] (SUPER+M, then a number).
################################################################################
submap = move-all
bind = , escape, submap, reset
bind = , 1, exec, $HOME/.config/hypr/scripts/move-all.sh 1
bind = , 1, submap, reset
bind = , 2, exec, $HOME/.config/hypr/scripts/move-all.sh 2
bind = , 2, submap, reset
bind = , 3, exec, $HOME/.config/hypr/scripts/move-all.sh 3
bind = , 3, submap, reset
bind = , 4, exec, $HOME/.config/hypr/scripts/move-all.sh 4
bind = , 4, submap, reset
bind = , 5, exec, $HOME/.config/hypr/scripts/move-all.sh 5
bind = , 5, submap, reset
bind = , 6, exec, $HOME/.config/hypr/scripts/move-all.sh 6
bind = , 6, submap, reset
bind = , 7, exec, $HOME/.config/hypr/scripts/move-all.sh 7
bind = , 7, submap, reset
bind = , 8, exec, $HOME/.config/hypr/scripts/move-all.sh 8
bind = , 8, submap, reset
bind = , 9, exec, $HOME/.config/hypr/scripts/move-all.sh 9
bind = , 9, submap, reset
bind = , 0, exec, $HOME/.config/hypr/scripts/move-all.sh 10
bind = , 0, submap, reset
submap = reset

################################################################################
# MOUSE
################################################################################
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

################################################################################
# SCREENSHOTS / CLIPBOARD
################################################################################
# Region -> clipboard. Direct replacement for the i3 bind
# mod+shift+s -> maim --select | xclip.
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy
# Whole screen -> clipboard.
bind = , Print, exec, grim - | wl-copy
# Region -> swappy, to annotate before saving or copying.
bind = $mainMod SHIFT, A, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mainMod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = $mainMod, C, exec, hyprpicker -a

################################################################################
# MEDIA / HARDWARE KEYS
################################################################################
# wpctl ships with wireplumber, which is already the session's audio daemon —
# no extra OSD daemon needed, waybar shows the level.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
